# Orders service + its PostgreSQL database, for RELAY AEGIS demonstrations.
#   docker compose up -d --build
# The service listens on http://localhost:8082; health at /actuator/health.
services:
  orders-postgres:
    image: postgres:16-alpine
    container_name: orders-postgres
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:-orders-demo-2026}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - orders-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  orders-service:
    build: .
    container_name: orders-service
    depends_on:
      orders-postgres:
        condition: service_healthy
    environment:
      ORDERS_DB_URL: jdbc:postgresql://orders-postgres:5432/orders
      ORDERS_DB_USER: orders
      # Read only once the hard-coded password in DatabaseConfig.java is replaced by an environment variable.
      DB_PASSWORD: ${ORDERS_DB_PASSWORD:-orders-demo-2026}
    ports:
      - "8082:8080"
    restart: unless-stopped

volumes:
  orders-postgres-data:
